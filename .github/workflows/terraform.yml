name: Terraform CI and deployment

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/*.tfvars.example"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/*.tfvars.example"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderflow-dev-terraform
  cancel-in-progress: false

jobs:
  validate:
    name: Terraform static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate state backend bootstrap
        run: |
          terraform -chdir=bootstrap/state-backend init -backend=false -input=false
          terraform -chdir=bootstrap/state-backend validate -no-color

      - name: Validate GitHub OIDC bootstrap
        run: |
          terraform -chdir=bootstrap/github-oidc init -backend=false -input=false
          terraform -chdir=bootstrap/github-oidc validate -no-color

      - name: Validate dev environment and modules
        run: |
          terraform -chdir=environments/dev init -backend=false -input=false
          terraform -chdir=environments/dev validate -no-color

  plan:
    name: Plan dev infrastructure
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_operator_public_cidr: ${{ secrets.TF_VAR_OPERATOR_PUBLIC_CIDR }}
      TF_VAR_cluster_admin_principal_arn: ${{ secrets.TF_VAR_CLUSTER_ADMIN_PRINCIPAL_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: orderflow-plan-${{ github.run_id }}
          aws-region: us-east-1

      - name: Initialize remote state
        working-directory: environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=orderflow/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create plan and store it in private S3
        working-directory: environments/dev
        env:
          PLAN_KEY: orderflow/dev/plans/${{ github.sha }}.tfplan
        run: |
          set +e
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/orderflow.tfplan" > "$RUNNER_TEMP/terraform-plan.log" 2>&1
          plan_status=$?
          set -e

          if [ "$plan_status" -ne 0 ]; then
            echo "Terraform plan failed. Review the Terraform plan step logs; secret values are masked by GitHub."
            tail -n 60 "$RUNNER_TEMP/terraform-plan.log"
            exit "$plan_status"
          fi

          terraform show -json "$RUNNER_TEMP/orderflow.tfplan" > "$RUNNER_TEMP/orderflow-plan.json"
          echo "## Terraform plan for dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            .resource_changes[]?
            | select(.change.actions != ["no-op"])
            | "- \(.change.actions | join(", ")): `\(.address)`"
          ' "$RUNNER_TEMP/orderflow-plan.json" >> "$GITHUB_STEP_SUMMARY"

          aws s3 cp "$RUNNER_TEMP/orderflow.tfplan" "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" \
            --sse AES256 --only-show-errors
          echo "Saved the reviewed plan to the private Terraform state bucket for the gated apply job."

  apply:
    name: Apply approved dev plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: infra-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_operator_public_cidr: ${{ secrets.TF_VAR_OPERATOR_PUBLIC_CIDR }}
      TF_VAR_cluster_admin_principal_arn: ${{ secrets.TF_VAR_CLUSTER_ADMIN_PRINCIPAL_ARN }}
      PLAN_KEY: orderflow/dev/plans/${{ github.sha }}.tfplan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0

      - name: Configure short-lived AWS credentials through OIDC
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: orderflow-apply-${{ github.run_id }}
          aws-region: us-east-1

      - name: Initialize remote state
        working-directory: environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=orderflow/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download and apply the exact planned changes
        working-directory: environments/dev
        run: |
          aws s3 cp "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" "$RUNNER_TEMP/orderflow.tfplan" \
            --only-show-errors
          terraform apply -input=false "$RUNNER_TEMP/orderflow.tfplan"

      - name: Delete the private plan object after apply
        if: always() && steps.aws-auth.outcome == 'success'
        run: aws s3 rm "s3://${TF_STATE_BUCKET}/${PLAN_KEY}" --only-show-errors || true
